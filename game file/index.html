// --- Audio Control Helpers ---
const playSongFromBeginning = () => {
  const song = document.getElementById('gameSong');
  if (song) {
    song.currentTime = 0;
    song.play().catch(() => {});
  }
};

const playSongRandomPart = (durationMs = null) => {
  const song = document.getElementById('gameSong');
  if (song) {
    const maxTime = song.duration && !isNaN(song.duration) ? song.duration - 10 : 30;
    const randomTime = Math.max(0, Math.random() * maxTime);
    song.currentTime = randomTime;
    song.play().catch(() => {});

    if (durationMs) {
      setTimeout(() => {
        song.pause();
      }, durationMs);
    }
  }
};

const stopSong = () => {
  const song = document.getElementById('gameSong');
  if (song) {
    song.pause();
  }
};

// --- Web Audio API for Sound Effects ---
const playTone = (freq, type, duration, vol = 0.1) => {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.onended = () => { void ctx.close(); };
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {
    console.error("Audio error", e);
  }
};

function App() {
  const [gameStarted, setGameStarted] = useState(false);
  const [players, setPlayers] = useState([]);
  const [playerRoles, setPlayerRoles] = useState({});
  const [newPlayerName, setNewPlayerName] = useState('');
  const [newPlayerRole, setNewPlayerRole] = useState('KING');
  const [roomCode, setRoomCode] = useState('');
  const [roomInput, setRoomInput] = useState('');
  const [roomStatus, setRoomStatus] = useState('Create a room or join with a room code to play remotely.');
  const [currentPlayerIndex, setCurrentPlayerIndex] = useState(0);

  const [eliminatedPlayers, setEliminatedPlayers] = useState([]);
  const [playerEmblems, setPlayerEmblems] = useState({});
  const [royaltyPlayer, setRoyaltyPlayer] = useState(null);
  const [crownAnnouncement, setCrownAnnouncement] = useState(null);

  const [activeRules, setActiveRules] = useState([]);
  const [ruleInputOpen, setRuleInputOpen] = useState(false);
  const [newRuleText, setNewRuleText] = useState('');

  const [rotation, setRotation] = useState(0);
  const [lastSegmentIndex, setLastSegmentIndex] = useState(null);
  const [isSpinning, setIsSpinning] = useState(false);
  const [lastResult, setLastResult] = useState(null);

  const [timedOverlay, setTimedOverlay] = useState(null);
  const [coinGame, setCoinGame] = useState(null);
  const [diceGame, setDiceGame] = useState(null);
  const [dqDiceGame, setDqDiceGame] = useState(null);
  const [dareTimerModal, setDareTimerModal] = useState(null);

  const dareTimerRef = useRef(null);
  const audioIntervalRef = useRef(null);
  const roomRef = useRef(null);
  const roomMessageHandlerRef = useRef(null);
  const requestIdRef = useRef(0);

  const activePlayersList = players.filter(p => !eliminatedPlayers.includes(p));
  const isRoomConnected = Boolean(roomCode && roomRef.current);
  const isOverlayBlocking = Boolean(timedOverlay) || Boolean(coinGame) || Boolean(diceGame) || Boolean(dqDiceGame) || ruleInputOpen || Boolean(dareTimerModal);

  useEffect(() => {
    playSongFromBeginning();
  }, []);

  const readRemoteState = (data) => {
    if (!data) return;
    setGameStarted(Boolean(data.gameStarted));
    setPlayers(Array.isArray(data.players) ? data.players : []);
    setPlayerRoles(data.playerRoles || {});
    setEliminatedPlayers(Array.isArray(data.eliminatedPlayers) ? data.eliminatedPlayers : []);
    setCurrentPlayerIndex(Number.isInteger(data.currentPlayerIndex) ? data.currentPlayerIndex : 0);
    setRoyaltyPlayer(data.royaltyPlayer || null);
    setPlayerEmblems(data.playerEmblems || {});
    setActiveRules(Array.isArray(data.activeRules) ? data.activeRules : []);
    setCoinGame(data.coinGame || null);
    setDiceGame(data.diceGame || null);
    setDqDiceGame(data.dqDiceGame || null);
    setTimedOverlay(data.timedOverlay || null);
    setRuleInputOpen(Boolean(data.ruleInputOpen));
    setRotation(Number(data.rotation) || 0);
    setLastSegmentIndex(data.lastSegmentIndex !== undefined ? data.lastSegmentIndex : null);
    setIsSpinning(Boolean(data.isSpinning));
    setLastResult(data.lastResult || null);
    setCrownAnnouncement(data.crownAnnouncement || null);
    setDareTimerModal(data.dareTimerModal || null);
  };

  const currentGameState = (overrides = {}) => ({
    gameStarted: overrides.gameStarted ?? gameStarted,
    players: overrides.players ?? players,
    playerRoles: overrides.playerRoles ?? playerRoles,
    eliminatedPlayers: overrides.eliminatedPlayers ?? eliminatedPlayers,
    currentPlayerIndex: overrides.currentPlayerIndex ?? currentPlayerIndex,
    royaltyPlayer: overrides.royaltyPlayer !== undefined ? overrides.royaltyPlayer : royaltyPlayer,
    playerEmblems: overrides.playerEmblems ?? playerEmblems,
    activeRules: overrides.activeRules ?? activeRules,
    coinGame: overrides.coinGame !== undefined ? overrides.coinGame : coinGame,
    diceGame: overrides.diceGame !== undefined ? overrides.diceGame : diceGame,
    dqDiceGame: overrides.dqDiceGame !== undefined ? overrides.dqDiceGame : dqDiceGame,
    timedOverlay: overrides.timedOverlay !== undefined ? overrides.timedOverlay : timedOverlay,
    ruleInputOpen: overrides.ruleInputOpen ?? ruleInputOpen,
    rotation: overrides.rotation ?? rotation,
    lastSegmentIndex: overrides.lastSegmentIndex !== undefined ? overrides.lastSegmentIndex : lastSegmentIndex,
    isSpinning: overrides.isSpinning ?? isSpinning,
    lastResult: overrides.lastResult !== undefined ? overrides.lastResult : lastResult,
    crownAnnouncement: overrides.crownAnnouncement !== undefined ? overrides.crownAnnouncement : crownAnnouncement,
    dareTimerModal: overrides.dareTimerModal !== undefined ? overrides.dareTimerModal : dareTimerModal,
  });

  const connectToRoom = async (requestedCode, createRoom = false) => {
    const normalizedCode = requestedCode.trim().toUpperCase();
    if (!/^[A-F0-9]{32}$/.test(normalizedCode)) {
      setRoomStatus('Room codes must be 32 hexadecimal characters.');
      return;
    }
    if (typeof Peer === 'undefined') {
      setRoomStatus('Peer library not loaded.');
      return;
    }

    setRoomStatus(createRoom ? 'Creating remote room…' : 'Connecting to room host…');
    const roomPeerId = `spin${normalizedCode}`;
    const newPeer = createRoom ? new Peer(roomPeerId) : new Peer();
    const room = {
      host: createRoom,
      peer: newPeer,
      connection: null,
      connections: [],
      state: null,
      pendingRequests: new Map(),
    };
    roomRef.current = room;

    const onDataConnection = (connection) => {
      room.connections.push(connection);
      connection.on('open', () => {
        if (room.state) connection.send({ type: 'STATE', state: room.state });
      });
      connection.on('data', message => roomMessageHandlerRef.current?.(room, message, connection));
    };

    newPeer.on('error', error => {
      setRoomStatus(`Connection error: ${error.message}`);
      if (roomRef.current === room) roomRef.current = null;
      newPeer.destroy();
    });

    newPeer.on('open', () => {
      if (createRoom) {
        setRoomCode(normalizedCode);
        setRoomInput(normalizedCode);
        room.state = currentGameState({
          gameStarted: false,
          players: [],
          playerRoles: {},
          eliminatedPlayers: [],
          currentPlayerIndex: 0,
          royaltyPlayer: null,
          playerEmblems: {},
          activeRules: [],
          timedOverlay: null,
          coinGame: null,
          diceGame: null,
          dqDiceGame: null,
          ruleInputOpen: false,
          rotation: 0,
          lastSegmentIndex: null,
          isSpinning: false,
          lastResult: null,
          crownAnnouncement: null,
          dareTimerModal: null,
        });
        readRemoteState(room.state);
        newPeer.on('connection', onDataConnection);
        setRoomStatus(`Room ${normalizedCode} is ready.`);
        return;
      }

      const connection = newPeer.connect(roomPeerId, { reliable: true });
      room.connection = connection;
      connection.on('open', () => {
        setRoomCode(normalizedCode);
        setRoomInput(normalizedCode);
        setRoomStatus(`Connected to room ${normalizedCode}.`);
      });
      connection.on('data', message => roomMessageHandlerRef.current?.(room, message, connection));
      newPeer.on('connection', onDataConnection);
    });
  };

  const createRoom = () => {
    const bytes = new Uint8Array(16);
    window.crypto.getRandomValues(bytes);
    const code = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('').toUpperCase();
    connectToRoom(code, true);
  };

  const receiveRoomMessage = (room, message, connection) => {
    if (!message || typeof message !== 'object') return;

    if (room.host && message.type === 'PATCH') {
      room.state = { ...room.state, ...message.patch };
      readRemoteState(room.state);
      room.connections.forEach(peerConnection => {
        if (peerConnection.open) peerConnection.send({ type: 'STATE', state: room.state });
      });
      return;
    }

    if (room.host && message.type === 'ACTION') {
      const state = room.state;
      let result = null;
      if (message.action === 'RESERVE_SPIN') {
        const index = message.currentPlayerIndex;
        if (
          !state.isSpinning
          && !state.timedOverlay
          && !state.coinGame
          && !state.diceGame
          && !state.dqDiceGame
          && !state.ruleInputOpen
          && !state.dareTimerModal
          && state.gameStarted
          && state.currentPlayerIndex === index
          && state.players.length >= 2
        ) {
          room.state = { ...state, isSpinning: true };
          result = room.state;
        }
      } else if (message.action === 'RESERVE_GAME') {
        const game = state[message.gameKey];
        if (game && !game[message.busyKey] && !game[message.completedKey]) {
          room.state = { ...state, [message.gameKey]: { ...game, [message.busyKey]: true } };
          result = room.state[message.gameKey];
        }
      } else if (message.action === 'SET_COIN_CHOICE') {
        const game = state.coinGame;
        if (game && !game.isFlipping && !game.winner && game.contenders.includes(message.player)) {
          room.state = {
            ...state,
            coinGame: {
              ...game,
              choices: { ...game.choices, [message.player]: message.side },
              message: null,
            },
          };
          result = true;
        }
      } else if (message.action === 'ADD_PLAYER') {
        const name = message.playerName;
        const role = message.playerRole || 'KING';
        if (!state.gameStarted && name && name.trim() && !(state.players || []).some(p => p.toLowerCase() === name.toLowerCase())) {
          room.state = {
            ...state,
            players: [...(state.players || []), name],
            playerRoles: { ...(state.playerRoles || {}), [name]: role },
          };
          result = true;
        }
      } else if (message.action === 'REMOVE_PLAYER') {
        if (!state.gameStarted && (state.players || []).includes(message.playerName)) {
          const removedIndex = state.players.indexOf(message.playerName);
          const updatedPlayers = state.players.filter(p => p !== message.playerName);
          const updatedRoles = { ...state.playerRoles };
          delete updatedRoles[message.playerName];
          let nextIndex = state.currentPlayerIndex - (removedIndex < state.currentPlayerIndex ? 1 : 0);
          if (nextIndex >= updatedPlayers.length) nextIndex = 0;
          room.state = { ...state, players: updatedPlayers, playerRoles: updatedRoles, currentPlayerIndex: nextIndex };
          result = true;
        }
      } else if (message.action === 'START_GAME') {
        if (!state.gameStarted && (state.players || []).length >= 2) {
          room.state = { ...state, gameStarted: true, currentPlayerIndex: 0 };
          result = true;
        }
      }

      connection.send({ type: 'ACTION_RESULT', requestId: message.requestId, result });
      if (result) {
        readRemoteState(room.state);
        room.connections.forEach(peerConnection => {
          if (peerConnection.open) peerConnection.send({ type: 'STATE', state: room.state });
        });
      }
      return;
    }

    if (message.type === 'STATE' && !room.host) {
      room.state = message.state;
      readRemoteState(room.state);
      return;
    }

    if (message.type === 'ACTION_RESULT') {
      const resolve = room.pendingRequests.get(message.requestId);
      if (resolve) {
        room.pendingRequests.delete(message.requestId);
        resolve(message.result);
      }
    }
  };
  roomMessageHandlerRef.current = receiveRoomMessage;

  const broadcastState = (overrides = {}) => {
    const room = roomRef.current;
    if (!room || !Object.keys(overrides).length) return;
    if (room.host) {
      room.state = { ...room.state, ...overrides };
      readRemoteState(room.state);
      room.connections.forEach(connection => {
        if (connection.open) connection.send({ type: 'STATE', state: room.state });
      });
    } else if (room.connection?.open) {
      room.connection.send({ type: 'PATCH', patch: overrides });
    }
  };

  const requestRoomAction = (action) => new Promise(resolve => {
    const room = roomRef.current;
    if (!room) {
      resolve(null);
      return;
    }
    const requestId = `${Date.now()}-${++requestIdRef.current}`;
    if (room.host) {
      receiveRoomMessage(room, { type: 'ACTION', requestId, ...action }, {
        send: response => resolve(response.result),
      });
      return;
    }
    if (!room.connection?.open) {
      resolve(null);
      return;
    }
    room.pendingRequests.set(requestId, resolve);
    room.connection.send({ type: 'ACTION', requestId, ...action });
    setTimeout(() => {
      const pending = room.pendingRequests.get(requestId);
      if (pending) {
        room.pendingRequests.delete(requestId);
        pending(null);
      }
    }, 10000);
  });

  const reserveGameAction = (gameKey, busyKey, completedKey) => requestRoomAction({
    action: 'RESERVE_GAME',
    gameKey,
    busyKey,
    completedKey,
  });

  useEffect(() => () => {
    const room = roomRef.current;
    if (room?.peer && !room.peer.destroyed) room.peer.destroy();
  }, []);

  useEffect(() => {
    if (!dareTimerModal) {
      if (dareTimerRef.current) clearInterval(dareTimerRef.current);
      stopSong();
      return;
    }
    playSongRandomPart();

    dareTimerRef.current = setInterval(() => {
      setDareTimerModal(prev => {
        if (!prev) return null;
        if (prev.timeLeft <= 1) {
          clearInterval(dareTimerRef.current);
          stopSong();
          playDing();
          if (prev.stage === '60') {
            return { ...prev, stage: '30_waiting', timeLeft: 30 };
          } else if (prev.stage === '30') {
            const updatedOverlay = {
              type: 'ALL_DARE',
              title: 'TIME EXPIRED!',
              subtitle: `Both players failed to dare in time! Every active player must complete a challenge!`,
              nextPlayerIdx: prev.nextPlayerIdx,
            };
            setTimedOverlay(updatedOverlay);
            broadcastState({ timedOverlay: updatedOverlay, dareTimerModal: null });
            return null;
          }
        }
        return { ...prev, timeLeft: prev.timeLeft - 1 };
      });
    }, 1000);

    return () => {
      if (dareTimerRef.current) clearInterval(dareTimerRef.current);
    };
  }, [dareTimerModal?.stage]);

  const handleWinnerDareSuccess = () => {
    stopSong();
    playFanfare();
    const nextIdx = dareTimerModal.nextPlayerIdx;
    setDareTimerModal(null);
    setCurrentPlayerIndex(nextIdx);
    broadcastState({ dareTimerModal: null, currentPlayerIndex: nextIdx });
  };

  const handleLoserRedButton30 = () => {
    setDareTimerModal(prev => prev ? { ...prev, stage: '30', timeLeft: 30 } : null);
    broadcastState({ dareTimerModal: { ...dareTimerModal, stage: '30', timeLeft: 30 } });
  };

  const triggerDareTimer = (winner, loser, nextPlayerIdx) => {
    const timerData = { winner, loser, stage: '60', timeLeft: 60, nextPlayerIdx };
    setDareTimerModal(timerData);
    broadcastState({ dareTimerModal: timerData });
  };

  const finishTimedTurn = (nextPlayerIdx) => {
    setTimedOverlay(null);
    setCurrentPlayerIndex(nextPlayerIdx);
    broadcastState({ timedOverlay: null, currentPlayerIndex: nextPlayerIdx });
  };

  useEffect(() => {
    if (!timedOverlay || !timedOverlay.duration || !Number.isInteger(timedOverlay.nextPlayerIdx)) return undefined;
    const timer = setTimeout(
      () => finishTimedTurn(timedOverlay.nextPlayerIdx),
      timedOverlay.duration,
    );
    return () => clearTimeout(timer);
  }, [timedOverlay]);

  const handlePassRoyalDare = (targetPlayer) => {
    if (timedOverlay?.type !== 'ROYAL_DARE_PICK' || !activePlayersList.includes(targetPlayer)) return;
    const updatedOverlay = {
      type: 'ROYAL_DARE',
      title: 'DARE PASSED',
      subtitle: `${royaltyPlayer} passes the dare to ${targetPlayer}.`,
      nextPlayerIdx: timedOverlay.nextPlayerIdx,
    };
    setTimedOverlay(updatedOverlay);
    broadcastState({ timedOverlay: updatedOverlay });
  };

  const openRoyalDarePicker = () => {
    if (!royaltyPlayer || isOverlayBlocking) return;
    const royaltyTitle = playerRoles[royaltyPlayer] || 'KING/QUEEN';
    const overlay = {
      type: 'ROYAL_DARE_PICK',
      title: `${royaltyTitle}: CHOOSE A PLAYER`,
      subtitle: `${royaltyPlayer} may pass this dare to any active player.`,
      nextPlayerIdx: currentPlayerIndex,
    };
    setTimedOverlay(overlay);
    broadcastState({ timedOverlay: overlay });
  };

  useEffect(() => {
    if (isSpinning) {
      let delay = 90;
      let active = true;
      const tickLoop = () => {
        if (!active) return;
        playSteampunkGear();
        delay = Math.min(delay * 1.09, 380);
        audioIntervalRef.current = setTimeout(tickLoop, delay);
      };
      tickLoop();
      return () => {
        active = false;
        if (audioIntervalRef.current) clearTimeout(audioIntervalRef.current);
      };
    }
  }, [isSpinning]);

  const handleAddPlayer = (e) => {
    e.preventDefault();
    if (!isRoomConnected) return;
    const trimmed = newPlayerName.trim();
    if (!trimmed) return;
    if (players.some(p => p.toLowerCase() === trimmed.toLowerCase())) {
      window.alert('That participant is already in the game.');
      return;
    }
    requestRoomAction({ action: 'ADD_PLAYER', playerName: trimmed, playerRole: newPlayerRole }).then(added => {
      if (added) setNewPlayerName('');
    });
  };

  const handleRemovePlayer = (idx) => {
    if (isSpinning) return;
    const playerToRemove = players[idx];
    if (!playerToRemove || !roomRef.current) return;
    requestRoomAction({ action: 'REMOVE_PLAYER', playerName: playerToRemove });
  };

  const handleStartGame = () => {
    if (!isRoomConnected || players.length < 2) return;
    requestRoomAction({ action: 'START_GAME' });
  };

  const handleSaveNewRule = (e) => {
    e.preventDefault();
    const txt = newRuleText.trim();
    if (!txt) return;

    let updatedRules = [...activeRules, { text: txt, author: players[currentPlayerIndex] }];
    if (updatedRules.length > 3) {
      updatedRules.shift();
    }
    setActiveRules(updatedRules);
    setNewRuleText('');
    setRuleInputOpen(false);

    const nextIdx = (currentPlayerIndex + 1) % players.length;
    setCurrentPlayerIndex(nextIdx);
    broadcastState({
      activeRules: updatedRules,
      currentPlayerIndex: nextIdx,
      ruleInputOpen: false,
    });
  };

  const eliminatePlayer = (playerName, gameState = {}) => {
    if (!playerName) {
      return {
        eliminatedPlayers: gameState.eliminatedPlayers || eliminatedPlayers,
        playerEmblems: gameState.playerEmblems || playerEmblems,
        royaltyPlayer: Object.prototype.hasOwnProperty.call(gameState, 'royaltyPlayer') ? gameState.royaltyPlayer : royaltyPlayer,
      };
    }

    playSongRandomPart(5000);

    const currentEmblems = gameState.playerEmblems || playerEmblems;
    const currentEliminatedPlayers = gameState.eliminatedPlayers || eliminatedPlayers;
    const currentRoyalty = Object.prototype.hasOwnProperty.call(gameState, 'royaltyPlayer') ? gameState.royaltyPlayer : royaltyPlayer;
    const emblems = currentEmblems[playerName] || {};
    const usesRoyalImmunity = currentRoyalty === playerName && emblems.kingImmunity;
    const protection = usesRoyalImmunity ? 'kingImmunity' : emblems.immunity ? 'immunity' : emblems.resurrection ? 'resurrection' : null;

    if (protection) {
      const newEmblems = {
        ...currentEmblems,
        [playerName]: { ...emblems, [protection]: false },
      };
      setPlayerEmblems(newEmblems);
      const newRoyaltyPlayer = usesRoyalImmunity ? null : currentRoyalty;
      if (usesRoyalImmunity) setRoyaltyPlayer(null);
      return {
        eliminatedPlayers: currentEliminatedPlayers,
        playerEmblems: newEmblems,
        royaltyPlayer: newRoyaltyPlayer,
      };
    }

    const newEliminated = currentEliminatedPlayers.includes(playerName) ? currentEliminatedPlayers : [...currentEliminatedPlayers, playerName];
    setEliminatedPlayers(newEliminated);
    return {
      eliminatedPlayers: newEliminated,
      playerEmblems: currentEmblems,
      royaltyPlayer: currentRoyalty,
    };
  };

  const resurrectPlayerTrigger = () => {
    playSongRandomPart(5000);
  };

  const hasEliminationProtection = (playerName, emblemsMap = playerEmblems, currentRoyalty = royaltyPlayer) => {
    const emblems = emblemsMap[playerName] || {};
    return Boolean(emblems.immunity || emblems.resurrection || (currentRoyalty === playerName && emblems.kingImmunity));
  };

  const handleRollDice = async () => {
    if (!diceGame || diceGame.isRolling || diceGame.winner) return;
    const lockedGame = await reserveGameAction('diceGame', 'isRolling', 'winner');
    if (!lockedGame) return;
    const rollingState = { ...lockedGame, tieMessage: null };
    setDiceGame(rollingState);
    playSteampunkGear();

    setTimeout(() => {
      const die1 = Math.floor(Math.random() * 6) + 1;
      const die2 = Math.floor(Math.random() * 6) + 1;
      const total = die1 + die2;

      if (lockedGame.turn === 'spinner') {
        const nextState = {
          ...lockedGame,
          isRolling: false,
          diceValues: [die1, die2],
          spinnerRoll: { die1, die2, total },
          turn: 'opponent',
        };
        setDiceGame(nextState);
        broadcastState({ diceGame: nextState });
      } else {
        const spinnerTotal = lockedGame.spinnerRoll.total;
        if (total === spinnerTotal) {
          const tieState = {
            ...lockedGame,
            isRolling: false,
            diceValues: [die1, die2],
            spinnerRoll: null,
            opponentRoll: null,
            turn: 'spinner',
            tieMessage: `TIE AT ${total}! Roll again!`,
          };
          setDiceGame(tieState);
          broadcastState({ diceGame: tieState });
        } else {
          const winnerName = total > spinnerTotal ? lockedGame.opponentName : lockedGame.spinnerName;
          const loserName = total > spinnerTotal ? lockedGame.spinnerName : lockedGame.opponentName;
          const finalState = {
            ...lockedGame,
            isRolling: false,
            diceValues: [die1, die2],
            opponentRoll: { die1, die2, total },
            winner: winnerName,
            loser: loserName,
          };
          setDiceGame(finalState);
          broadcastState({ diceGame: finalState });
          playFanfare();
        }
      }
    }, 900);
  };

  const handleCompleteDiceShowdown = () => {
    if (!diceGame) return;
    const winner = diceGame.winner;
    const loser = diceGame.loser;
    const elimination = eliminatePlayer(loser);
    const nextIdx = diceGame.nextPlayerIdx;
    setDiceGame(null);
    broadcastState({
      diceGame: null,
      eliminatedPlayers: elimination.eliminatedPlayers,
      playerEmblems: elimination.playerEmblems,
      royaltyPlayer: elimination.royaltyPlayer,
    });
    triggerDareTimer(winner, loser, nextIdx);
  };

  const handleRollDqDice = async () => {
    if (!dqDiceGame || dqDiceGame.isRolling || dqDiceGame.matchOver) return;
    const lockedGame = await reserveGameAction('dqDiceGame', 'isRolling', 'matchOver');
    if (!lockedGame) return;
    setDqDiceGame(lockedGame);
    playSteampunkGear();

    setTimeout(() => {
      const p1Val = Math.floor(Math.random() * 6) + 1;
      const p2Val = Math.floor(Math.random() * 6) + 1;

      let newP1Wins = lockedGame.p1Wins;
      let newP2Wins = lockedGame.p2Wins;
      let roundMsg = '';

      if (p1Val > p2Val) {
        newP1Wins += 1;
        roundMsg = `${lockedGame.p1Name} wins round ${lockedGame.round}!`;
      } else if (p2Val > p1Val) {
        newP2Wins += 1;
        roundMsg = `${lockedGame.p2Name} wins round ${lockedGame.round}!`;
      } else {
        roundMsg = `Round ${lockedGame.round} is a tie!`;
      }

      const matchEnded = newP1Wins === 2 || newP2Wins === 2 || (lockedGame.round >= 3 && newP1Wins !== newP2Wins);
      let matchWinner = null;
      let matchLoser = null;

      if (matchEnded) {
        if (newP1Wins > newP2Wins) {
          matchWinner = lockedGame.p1Name;
          matchLoser = lockedGame.p2Name;
        } else {
          matchWinner = lockedGame.p2Name;
          matchLoser = lockedGame.p1Name;
        }
      }

      const updated = {
        ...lockedGame,
        isRolling: false,
        diceValues: [p1Val, p2Val],
        p1Wins: newP1Wins,
        p2Wins: newP2Wins,
        round: lockedGame.round + 1,
        roundMessage: roundMsg,
        matchOver: matchEnded,
        winner: matchWinner,
        loser: matchLoser,
      };

      setDqDiceGame(updated);
      broadcastState({ dqDiceGame: updated });
      if (matchEnded) playFanfare();
    }, 900);
  };

  const handleCompleteDqDice = () => {
    if (!dqDiceGame) return;
    const winner = dqDiceGame.winner;
    const loser = dqDiceGame.loser;
    const elimination = eliminatePlayer(loser);
    const nextIdx = dqDiceGame.nextPlayerIdx;
    setDqDiceGame(null);
    broadcastState({
      dqDiceGame: null,
      eliminatedPlayers: elimination.eliminatedPlayers,
      playerEmblems: elimination.playerEmblems,
      royaltyPlayer: elimination.royaltyPlayer,
    });
    triggerDareTimer(winner, loser, nextIdx);
  };

  const handleSelectCoinSide = (playerName, side) => {
    if (!coinGame || coinGame.isFlipping || coinGame.winner) return;
    const updatedChoices = { ...coinGame.choices, [playerName]: side };
    const updatedGame = { ...coinGame, choices: updatedChoices, message: null };
    setCoinGame(updatedGame);
    requestRoomAction({ action: 'SET_COIN_CHOICE', player: playerName, side });
  };

  const handleFlipCoins = async () => {
    if (!coinGame || coinGame.isFlipping || coinGame.winner) return;
    const allChosen = coinGame.contenders.every(p => coinGame.choices[p]);
    if (!allChosen) return;

    const flippingState = await reserveGameAction(
      'coinGame',
      'isFlipping',
      'winner',
      game => game.contenders.every(player => game.choices[player]),
    );
    if (!flippingState) return;
    const coinAtFlip = { ...flippingState, message: 'Coin flipping in progress...' };
    setCoinGame(coinAtFlip);
    broadcastState({ coinGame: coinAtFlip });
    playCoinSound();

    setTimeout(() => {
      const outcome = Math.random() < 0.5 ? 'HEADS' : 'TAILS';
      const matchingPlayers = coinAtFlip.contenders.filter(p => coinAtFlip.choices[p] === outcome);

      let nextContenders = coinAtFlip.contenders;
      let nextWinner = null;
      let nextMessage = '';
      let nextRound = coinAtFlip.round;

      if (matchingPlayers.length === 1) {
        nextContenders = matchingPlayers;
        nextWinner = matchingPlayers[0];
        nextMessage = `Coin landed on ${outcome}! ${nextWinner} is the last contender standing!`;
        playFanfare();
      } else if (matchingPlayers.length === 0) {
        nextMessage = `Coin landed on ${outcome}! Nobody picked ${outcome} — repeating Round ${coinAtFlip.round}.`;
        nextRound = coinAtFlip.round + 1;
      } else {
        nextContenders = matchingPlayers;
        nextRound = coinAtFlip.round + 1;
        nextMessage = `Coin landed on ${outcome}! ${matchingPlayers.length} players advance to Round ${nextRound}.`;
      }

      const resolved = {
        ...coinAtFlip,
        isFlipping: false,
        flippedResult: outcome,
        contenders: nextContenders,
        choices: {},
        round: nextRound,
        winner: nextWinner,
        message: nextMessage,
      };
      setCoinGame(resolved);
      broadcastState({ coinGame: resolved });
    }, 1200);
  };

  const handleCompleteCoinShowdown = () => {
    if (!coinGame || !coinGame.winner) return;
    const nextIdx = coinGame.nextPlayerIdx;
    const showdown = {
      spinnerName: coinGame.spinnerName,
      opponentName: coinGame.winner,
      turn: 'spinner',
      spinnerRoll: null,
      opponentRoll: null,
      diceValues: [3, 5],
      isRolling: false,
      winner: null,
      loser: null,
      tieMessage: null,
      nextPlayerIdx: nextIdx,
    };
    setCoinGame(null);
    setDiceGame(showdown);
    broadcastState({ coinGame: null, diceGame: showdown });
  };

  const handleSpin = async () => {
    if (!roomRef.current || isSpinning || isOverlayBlocking || players.length < 2) return;
    const expectedPlayerIndex = currentPlayerIndex;
    const reservation = await requestRoomAction({
      action: 'RESERVE_SPIN',
      currentPlayerIndex: expectedPlayerIndex,
    });
    if (!reservation) return;

    const roomPlayers = reservation.players;
    const roomCurrentPlayerIndex = reservation.currentPlayerIndex;
    const spinningPlayer = roomPlayers[roomCurrentPlayerIndex];
    if ((reservation.eliminatedPlayers || []).includes(spinningPlayer)) {
      const nextIdx = (roomCurrentPlayerIndex + 1) % roomPlayers.length;
      setCurrentPlayerIndex(nextIdx);
      broadcastState({ currentPlayerIndex: nextIdx, isSpinning: false });
      return;
    }

    const wasRoyaltyActive = Boolean(reservation.royaltyPlayer);
    let randomSegmentIndex;
    do {
      randomSegmentIndex = Math.floor(Math.random() * 8);
    } while (reservation.lastSegmentIndex === randomSegmentIndex);

    const extraSpins = 360 * 5;
    const targetSegmentCenterAngle = randomSegmentIndex * 45 + 22.5;
    const currentRotation = Number(reservation.rotation) || 0;
    const newRotation = currentRotation + extraSpins + (360 - (currentRotation % 360)) + targetSegmentCenterAngle;

    setRotation(newRotation);
    setLastSegmentIndex(randomSegmentIndex);
    setIsSpinning(true);
    setLastResult(null);
    setCrownAnnouncement(null);

    broadcastState({
      rotation: newRotation,
      lastSegmentIndex: randomSegmentIndex,
      isSpinning: true,
      lastResult: null,
      crownAnnouncement: null,
    });

    setTimeout(() => {
      const chosenSegment = SEGMENTS[randomSegmentIndex];
      const nextPlayerIdx = (roomCurrentPlayerIndex + 1) % roomPlayers.length;
      const royaltyTitle = playerRoles[spinningPlayer] || 'KING/QUEEN';

      let updatedRoyalty = reservation.royaltyPlayer || null;
      let announcement = null;
      let updatedEmblems = { ...(reservation.playerEmblems || {}) };
      let updatedEliminatedPlayers = [...(reservation.eliminatedPlayers || [])];
      let spinTimedOverlay = null;
      let spinCoinGame = null;
      let spinDiceGame = null;
      let spinDqDiceGame = null;
      let spinRuleInputOpen = false;

      const showSpinOverlay = (overlay) => {
        spinTimedOverlay = { ...overlay, nextPlayerIdx };
        setTimedOverlay(spinTimedOverlay);
      };

      const isNumbersActive = Boolean(wasRoyaltyActive || updatedRoyalty);

      if (!wasRoyaltyActive && chosenSegment.id === 6) {
        updatedRoyalty = spinningPlayer;
        updatedEmblems[spinningPlayer] = { ...(updatedEmblems[spinningPlayer] || {}), kingImmunity: true };
        setPlayerEmblems(updatedEmblems);
        announcement = `${spinningPlayer} landed on the Crown and is now crowned ${royaltyTitle}! Numbers (1–8) are now active.`;
        playFanfare();
      }

      setIsSpinning(false);
      setRoyaltyPlayer(updatedRoyalty);
      setLastResult({ ...chosenSegment, spunBy: spinningPlayer });
      setCrownAnnouncement(announcement);

      const otherActivePlayers = roomPlayers.filter(p => !updatedEliminatedPlayers.includes(p) && p !== spinningPlayer);
      const randomOtherPlayer = otherActivePlayers.length > 0 ? otherActivePlayers[Math.floor(Math.random() * otherActivePlayers.length)] : spinningPlayer;

      if (!isNumbersActive) {
        if (chosenSegment.id === 1) {
          showSpinOverlay({ type: 'DARE', title: 'DARE', subtitle: `${spinningPlayer.toUpperCase()} MUST COMPLETE A DARE FROM ${randomOtherPlayer.toUpperCase()}!`, duration: 5000 });
        } else if (chosenSegment.id === 2) {
          showSpinOverlay({ type: 'CLOVER', title: 'NEW ROYALTY / SKIP', subtitle: `YOU'RE IN LUCK, SKIP THIS TURN ${spinningPlayer.toUpperCase()}`, duration: 3000 });
        } else if (chosenSegment.id === 3) {
          spinRuleInputOpen = true;
          setRuleInputOpen(true);
        } else if (chosenSegment.id === 4) {
          spinDiceGame = { spinnerName: spinningPlayer, opponentName: randomOtherPlayer, turn: 'spinner', spinnerRoll: null, opponentRoll: null, diceValues: [3, 5], isRolling: false, winner: null, loser: null, tieMessage: null, nextPlayerIdx };
          setDiceGame(spinDiceGame);
        } else if (chosenSegment.id === 5) {
          showSpinOverlay({ type: 'ENJOY', title: 'ENJOY', subtitle: 'ALL INDULGE — NEXT TURN IN 5 SECONDS', duration: 5000 });
        } else if (chosenSegment.id === 6) {
          showSpinOverlay({ type: 'CROWN', title: royaltyTitle, subtitle: `${spinningPlayer.toUpperCase()} IS CROWNED ${royaltyTitle}!`, duration: 5000 });
        } else if (chosenSegment.id === 7) {
          spinCoinGame = { spinnerName: spinningPlayer, allPlayers: [...roomPlayers], contenders: otherActivePlayers.length > 0 ? otherActivePlayers : [...roomPlayers], choices: {}, round: 1, isFlipping: false, flippedResult: null, winner: null, nextPlayerIdx, message: 'All contenders choose Heads or Tails!' };
          setCoinGame(spinCoinGame);
        } else if (chosenSegment.id === 8) {
          showSpinOverlay({ type: 'HANDS', title: 'PICK A FRIEND', subtitle: `${spinningPlayer.toUpperCase()} PICKS A FRIEND!`, duration: 5000 });
        }
      } else {
        if (chosenSegment.id === 1) {
          updatedEmblems[spinningPlayer] = { ...(updatedEmblems[spinningPlayer] || {}), immunity: true };
          setPlayerEmblems(updatedEmblems);
          showSpinOverlay({ type: 'NUM1', title: 'IMMUNITY', subtitle: `${spinningPlayer.toUpperCase()} GAINED IMMUNITY (Green Shield)!`, duration: 5000 });
        } else if (chosenSegment.id === 2) {
          if (updatedRoyalty && updatedRoyalty !== spinningPlayer) {
            updatedEmblems[updatedRoyalty] = { ...(updatedEmblems[updatedRoyalty] || {}), kingImmunity: false };
          }
          updatedRoyalty = spinningPlayer;
          updatedEmblems[spinningPlayer] = { ...(updatedEmblems[spinningPlayer] || {}), kingImmunity: true };
          setPlayerEmblems(updatedEmblems);
          setRoyaltyPlayer(spinningPlayer);
          showSpinOverlay({ type: 'NUM2', title: 'NEW KING/QUEEN', subtitle: `${spinningPlayer.toUpperCase()} IS THE NEW ${royaltyTitle}!`, duration: 5000 });
        } else if (chosenSegment.id === 3 || chosenSegment.id === 8) {
          const wasProtected = hasEliminationProtection(spinningPlayer, updatedEmblems, updatedRoyalty);
          const elimination = eliminatePlayer(spinningPlayer, { eliminatedPlayers: updatedEliminatedPlayers, playerEmblems: updatedEmblems, royaltyPlayer: updatedRoyalty });
          updatedEliminatedPlayers = elimination.eliminatedPlayers;
          updatedEmblems = { ...elimination.playerEmblems };
          updatedRoyalty = elimination.royaltyPlayer;
          setRoyaltyPlayer(updatedRoyalty);
          showSpinOverlay({ type: 'NUM3', title: wasProtected ? 'PROTECTED' : 'GAME OVER', subtitle: wasProtected ? `${spinningPlayer.toUpperCase()} USED A PROTECTION EMBLEM!` : `${spinningPlayer.toUpperCase()} IS ELIMINATED!`, duration: 5000 });
        } else if (chosenSegment.id === 4) {
          showSpinOverlay({ type: 'NUM4', title: 'DARE FROM ALL', subtitle: `${spinningPlayer.toUpperCase()} MUST COMPLETE A DARE FROM EVERYONE!`, duration: 5000 });
        } else if (chosenSegment.id === 5) {
          spinDqDiceGame = { p1Name: spinningPlayer, p2Name: randomOtherPlayer, round: 1, p1Wins: 0, p2Wins: 0, diceValues: [1, 1], isRolling: false, roundMessage: 'First to 2 wins.', matchOver: false, winner: null, loser: null, nextPlayerIdx };
          setDqDiceGame(spinDqDiceGame);
        } else if (chosenSegment.id === 6) {
          updatedEmblems[spinningPlayer] = { ...(updatedEmblems[spinningPlayer] || {}), resurrection: true };
          setPlayerEmblems(updatedEmblems);
          resurrectPlayerTrigger();
          showSpinOverlay({ type: 'NUM6', title: 'RESURRECTION', subtitle: `${spinningPlayer.toUpperCase()} GAINED RESURRECTION (Cross)!`, duration: 5000 });
        } else if (chosenSegment.id === 7) {
          showSpinOverlay({ type: 'ROYAL_DARE_PICK', title: `${royaltyTitle}: CHOOSE A PLAYER`, subtitle: `${royaltyPlayer || 'THE CROWN'} may pass this dare to any active player.`, nextPlayerIdx });
        }
      }

      broadcastState({
        currentPlayerIndex: nextPlayerIdx,
        royaltyPlayer: updatedRoyalty,
        eliminatedPlayers: updatedEliminatedPlayers,
        playerEmblems: updatedEmblems,
        timedOverlay: spinTimedOverlay,
        coinGame: spinCoinGame,
        diceGame: spinDiceGame,
        dqDiceGame: spinDqDiceGame,
        ruleInputOpen: spinRuleInputOpen,
        rotation: newRotation,
        lastSegmentIndex: randomSegmentIndex,
        isSpinning: false,
        lastResult: { ...chosenSegment, spunBy: spinningPlayer },
        crownAnnouncement: announcement,
      });
    }, 4500);
  };

  // --- Landing Page ---
  if (!gameStarted) {
    return (
      <div className="w-full min-h-screen p-4 md:p-8 flex flex-col items-center justify-center select-none font-serif relative overflow-hidden" style={{ background: 'linear-gradient(135deg, #1e2226 0%, #363b40 35%, #191c20 70%, #0c0e10 100%)' }}>
        <div className="w-full max-w-xl rounded-[3rem] p-5 border-2 border-[#ffe8a3]/75 shadow-2xl relative z-10 bg-[#2a2008]">
          <div className="w-full rounded-[2.4rem] p-8 sm:p-12 flex flex-col items-center text-center border-2 border-[#241b05] relative overflow-hidden" style={{ background: 'conic-gradient(from 315deg at 50% 50%, #2a2008 0deg, #755b1b 35deg, #d6b456 65deg, #fffbe0 95deg, #ffe29a 115deg, #876a22 150deg, #1f1705 195deg, #6b5318 240deg, #ffe29a 285deg, #fffdf2 305deg, #997928 335deg, #2a2008 360deg)' }}>
            <h1 className="text-3xl sm:text-4xl font-black tracking-widest text-[#1c1405] uppercase mb-6 drop-shadow-lg">ROYAL SPINNER</h1>

            <section className="w-full mb-6 rounded-2xl border border-[#c7a446]/70 bg-black/75 p-4 text-left font-sans">
              <h2 className="mb-2 text-sm font-black uppercase tracking-wider text-[#ffe29a]">Remote Room</h2>
              <p className="mb-3 text-xs text-neutral-300">{roomStatus}</p>
              {!isRoomConnected ? (
                <div className="flex flex-col gap-2 sm:flex-row">
                  <button type="button" onClick={createRoom} className="rounded-xl bg-gradient-to-r from-[#ffe29a] to-[#b89439] px-4 py-2 text-xs font-black uppercase text-black">Create Room</button>
                  <input type="text" value={roomInput} onChange={e => setRoomInput(e.target.value.toUpperCase())} maxLength={32} placeholder="Paste room code" className="min-w-0 flex-1 rounded-xl border border-[#8c6d46] bg-black px-3 py-2 text-xs text-white" />
                  <button type="button" onClick={() => connectToRoom(roomInput)} disabled={roomInput.trim().length !== 32} className="rounded-xl border border-[#d4af37] px-4 py-2 text-xs font-bold uppercase text-[#ffe29a]">Join</button>
                </div>
              ) : (
                <div className="flex items-center gap-2">
                  <code className="min-w-0 flex-1 break-all rounded-lg bg-black px-3 py-2 text-xs text-[#ffe29a]">{roomCode}</code>
                  <button type="button" onClick={() => navigator.clipboard.writeText(roomCode)} className="rounded-xl border border-[#d4af37] px-3 py-2 text-xs font-bold uppercase text-[#ffe29a]">Copy Code</button>
                </div>
              )}
            </section>

            <form onSubmit={handleAddPlayer} className="w-full flex flex-col sm:flex-row gap-3 mb-6 font-sans">
              <input type="text" value={newPlayerName} onChange={e => setNewPlayerName(e.target.value)} placeholder="Player name..." maxLength={20} autoFocus disabled={!isRoomConnected} className="flex-1 bg-black/85 border-2 border-[#c7a446] rounded-2xl px-5 py-3 text-sm text-white focus:outline-none" />
              <select value={newPlayerRole} onChange={e => setNewPlayerRole(e.target.value)} disabled={!isRoomConnected} className="bg-black/85 border-2 border-[#c7a446] rounded-2xl px-4 py-3 text-sm text-[#ffe29a] font-bold focus:outline-none">
                <option value="KING">KING</option>
                <option value="QUEEN">QUEEN</option>
              </select>
              <button type="submit" disabled={!isRoomConnected} className="text-[#1c1405] font-black px-6 py-3 rounded-2xl text-sm uppercase bg-gradient-to-r from-[#ffe29a] to-[#b89439] cursor-pointer shadow-lg">+ Add</button>
            </form>

            <div className="w-full bg-black/75 border-2 border-[#c7a446]/60 rounded-2xl p-4 mb-6 min-h-[120px] max-h-48 overflow-y-auto font-sans">
              {players.length === 0 ? <p className="text-xs text-neutral-400 py-8 italic">No players added yet.</p> : (
                <div className="space-y-2">
                  {players.map((p, idx) => (
                    <div key={idx} className="flex items-center justify-between bg-[#1c1815] border border-[#c7a446]/50 rounded-xl px-4 py-2 text-sm text-white">
                      <span>{idx + 1}. {p} ({playerRoles[p] || 'KING'})</span>
                      <button type="button" onClick={() => handleRemovePlayer(idx)} className="text-neutral-400 hover:text-red-400 text-xs uppercase">Remove</button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <button type="button" onClick={handleStartGame} disabled={!isRoomConnected || players.length < 2} className={`w-full py-4 rounded-2xl font-black tracking-widest uppercase text-sm transition font-sans ${isRoomConnected && players.length >= 2 ? 'text-[#1c1405] cursor-pointer bg-gradient-to-r from-[#ffe29a] to-[#c7a446]' : 'bg-neutral-800 text-neutral-600 cursor-not-allowed'}`}>
              {!isRoomConnected ? 'Connect to a Room' : players.length >= 2 ? `Start Royal Spinner (${players.length})` : 'Add Players'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // --- Main Game View ---
  return (
    <div className="w-full min-h-screen p-4 md:p-8 flex flex-col items-center justify-center overflow-x-hidden select-none relative font-serif text-white" style={{ background: 'linear-gradient(135deg, #1e2226 0%, #363b40 35%, #191c20 70%, #0c0e10 100%)' }}>
      {/* Timed Dare Modal */}
      {dareTimerModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-md p-4 animate-fadeIn">
          <div className="max-w-xl w-full rounded-[3rem] border-4 border-[#d4af37] bg-[#1c140f] px-8 py-10 text-center shadow-2xl flex flex-col items-center font-sans">
            <h2 className="text-3xl font-black text-[#f3e5ab] uppercase mb-2">⏱️ DARE TIME</h2>
            <p className="text-sm text-neutral-300 mb-6">Winner: <strong className="text-[#ffe29a]">{dareTimerModal.winner}</strong> · Loser: <strong className="text-red-400">{dareTimerModal.loser}</strong></p>

            {dareTimerModal.stage === '60' && (
              <>
                <div className="text-6xl font-black text-amber-300 mb-6 font-mono">{dareTimerModal.timeLeft}s</div>
                <p className="text-xs text-neutral-400 mb-8">Winner has 60 seconds to dare the loser.</p>
                <button type="button" onClick={handleWinnerDareSuccess} className="w-full py-4 rounded-2xl bg-green-600 text-white font-black uppercase text-sm cursor-pointer hover:bg-green-500 shadow-lg">HA HA HA (Dare Given)</button>
              </>
            )}

            {dareTimerModal.stage === '30_waiting' && (
              <>
                <div className="text-xl font-bold text-red-400 mb-6">Winner failed to dare in time!</div>
                <p className="text-xs text-neutral-300 mb-8">Loser ({dareTimerModal.loser}), click the red button below to start your 30 seconds.</p>
                <button type="button" onClick={handleLoserRedButton30} className="w-full py-5 rounded-2xl bg-red-700 text-white font-black uppercase text-base tracking-widest cursor-pointer hover:bg-red-600 shadow-xl border-2 border-red-400">OUT OF TIME</button>
              </>
            )}

            {dareTimerModal.stage === '30' && (
              <>
                <div className="text-6xl font-black text-red-400 mb-6 font-mono">{dareTimerModal.timeLeft}s</div>
                <p className="text-xs text-neutral-400 mb-8">Loser has 30 seconds to dare the winner.</p>
                <button type="button" onClick={handleWinnerDareSuccess} className="w-full py-4 rounded-2xl bg-green-600 text-white font-black uppercase text-sm cursor-pointer hover:bg-green-500 shadow-lg">HA HA HA (Dare Given)</button>
              </>
            )}
          </div>
        </div>
      )}

      {/* Timed Overlays */}
      {timedOverlay && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4 animate-fadeIn">
          <div className="relative max-w-xl w-full overflow-hidden rounded-[3rem] border-4 border-[#d4af37] bg-[#464b50] px-8 py-10 text-center shadow-2xl">
            <h2 className="text-3xl sm:text-5xl font-black tracking-widest text-[#f3e5ab] uppercase mb-4">{timedOverlay.title}</h2>
            <p className="text-sm sm:text-lg font-bold text-white uppercase tracking-wider font-sans">{timedOverlay.subtitle}</p>
            {timedOverlay.type === 'ROYAL_DARE_PICK' && (
              <div className="mt-6 grid grid-cols-1 gap-2 sm:grid-cols-2 font-sans">
                {activePlayersList.filter(p => p !== royaltyPlayer).map(player => (
                  <button key={player} type="button" onClick={() => handlePassRoyalDare(player)} className="rounded-xl border border-[#d4af37] bg-black/80 px-4 py-3 text-sm font-bold text-[#ffe29a] hover:bg-[#3a2c20]">Pass dare to {player}</button>
                ))}
              </div>
            )}
            {timedOverlay.type === 'ROYAL_DARE' && (
              <button type="button" onClick={() => finishTimedTurn(timedOverlay.nextPlayerIdx)} className="mt-6 w-full rounded-xl bg-gradient-to-r from-[#ffe29a] to-[#b89439] px-4 py-3 font-sans text-sm font-black uppercase text-black">Continue Turn</button>
            )}
          </div>
        </div>
      )}

      {/* Rule Input Modal */}
      {ruleInputOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
          <div className="max-w-lg w-full p-8 rounded-[3rem] bg-[#1c140f] border-4 border-[#d4af37] shadow-2xl text-center">
            <h2 className="text-2xl font-black text-[#f3e5ab] uppercase mb-2">📜 MAKE A RULE</h2>
            <form onSubmit={handleSaveNewRule} className="flex flex-col gap-4 font-sans">
              <textarea rows={4} value={newRuleText} onChange={e => setNewRuleText(e.target.value)} placeholder="Type your new rule here..." autoFocus className="w-full bg-black/85 border-2 border-[#8c6d46] rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none" />
              <button type="submit" className="w-full py-4 rounded-2xl bg-gradient-to-r from-[#d4af37] to-[#8c6d46] text-black font-black uppercase cursor-pointer">Publish Rule</button>
            </form>
          </div>
        </div>
      )}

      {/* Dice Duel Modal */}
      {diceGame && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
          <div className="max-w-2xl w-full p-8 rounded-[3rem] bg-[#1c140f] border-4 border-[#d4af37] shadow-2xl text-center flex flex-col items-center">
            <h2 className="text-2xl font-bold text-[#f3e5ab] uppercase mb-1">🎲 Dice Duel</h2>
            <p className="text-xs text-neutral-400 mb-4 font-sans">{diceGame.spinnerName} vs. {diceGame.opponentName}</p>

            {diceGame.tieMessage && <div className="mb-4 px-4 py-2 bg-red-950 border border-red-500 text-red-200 text-xs font-bold rounded-xl font-sans">{diceGame.tieMessage}</div>}

            <div className="flex gap-6 my-4">
              <DieFaceSVG value={diceGame.diceValues[0]} rolling={diceGame.isRolling} />
              <DieFaceSVG value={diceGame.diceValues[1]} rolling={diceGame.isRolling} />
            </div>

            {!diceGame.winner ? (
              <button type="button" onClick={handleRollDice} disabled={diceGame.isRolling} className="w-full max-w-md py-4 rounded-2xl bg-gradient-to-r from-[#d4af37] to-[#8c6d46] text-black font-black uppercase cursor-pointer">
                {diceGame.turn === 'spinner' ? `${diceGame.spinnerName} Roll` : `${diceGame.opponentName} Roll`}
              </button>
            ) : (
              <div className="w-full flex flex-col items-center">
                <div className="mb-4 px-6 py-3.5 bg-[#3a2c20] border-2 border-[#d4af37] rounded-2xl text-[#f3e5ab] font-black text-lg shadow-xl">🏆 {diceGame.winner} wins! {diceGame.loser} is eliminated.</div>
                <button type="button" onClick={handleCompleteDiceShowdown} className="w-full max-w-md py-4 rounded-2xl bg-green-700 text-white font-black uppercase cursor-pointer">Continue (Dare Loser)</button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Dice Battle (DQ) Modal */}
      {dqDiceGame && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
          <div className="max-w-2xl w-full p-8 rounded-[3rem] bg-[#1c140f] border-4 border-[#d4af37] shadow-2xl text-center flex flex-col items-center">
            <h2 className="text-2xl font-bold text-[#f3e5ab] uppercase mb-1">⚔️ Dice Battle</h2>
            <p className="text-xs text-neutral-400 mb-4 font-sans">{dqDiceGame.p1Name} vs. {dqDiceGame.p2Name}</p>

            <div className="flex gap-6 my-4">
              <DieFaceSVG value={dqDiceGame.diceValues[0]} rolling={dqDiceGame.isRolling} />
              <DieFaceSVG value={dqDiceGame.diceValues[1]} rolling={dqDiceGame.isRolling} />
            </div>

            {!dqDiceGame.matchOver ? (
              <button type="button" onClick={handleRollDqDice} disabled={dqDiceGame.isRolling} className="w-full max-w-md py-4 rounded-2xl bg-gradient-to-r from-[#d4af37] to-[#8c6d46] text-black font-black uppercase cursor-pointer">Roll Dice</button>
            ) : (
              <div className="w-full flex flex-col items-center">
                <div className="mb-4 px-6 py-3.5 bg-[#3a2c20] border-2 border-[#d4af37] rounded-2xl text-[#f3e5ab] font-black text-lg shadow-xl">🏆 Match Winner: {dqDiceGame.winner}! {dqDiceGame.loser} is eliminated.</div>
                <button type="button" onClick={handleCompleteDqDice} className="w-full max-w-md py-4 rounded-2xl bg-green-700 text-white font-black uppercase cursor-pointer">Continue (Dare Loser)</button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Coin Elimination Modal */}
      {coinGame && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4 overflow-y-auto">
          <div className="max-w-3xl w-full p-8 rounded-[3rem] bg-[#1c140f] border-4 border-[#d4af37] shadow-2xl text-center flex flex-col items-center">
            <h2 className="text-2xl font-bold text-[#f3e5ab] uppercase mb-1">🪙 Coin Elimination (Round {coinGame.round})</h2>
            <p className="text-xs text-neutral-400 mb-4 font-sans">{coinGame.message || 'Choose Heads or Tails!'}</p>

            {coinGame.isFlipping && (
              <div className="my-8 flex flex-col items-center">
                <div className="w-24 h-24 rounded-full bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-600 border-4 border-white flex items-center justify-center text-black font-black text-2xl shadow-2xl animate-cinematic-coin">
                  👑
                </div>
                <p className="text-xs text-amber-200 mt-4 animate-pulse font-sans">Coin flipping through the air (gravity & physics)...</p>
              </div>
            )}

            <div className="w-full grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6 max-h-64 overflow-y-auto pr-1 font-sans">
              {coinGame.allPlayers.map((player, idx) => {
                const isActive = coinGame.contenders.includes(player);
                const choice = coinGame.choices[player];
                const isWinner = coinGame.winner === player;

                return (
                  <div key={idx} className={`flex items-center justify-between p-3.5 rounded-2xl border ${isWinner ? 'border-[#d4af37] bg-[#3a2c20]' : isActive ? 'border-neutral-700 bg-black/70' : 'opacity-40 border-neutral-900'}`}>
                    <div className="text-left">
                      <div className="font-bold text-sm">{player}</div>
                      <div className="text-[10px] text-neutral-400">{isWinner ? 'Winner!' : choice ? `Selected: ${choice}` : 'Awaiting choice'}</div>
                    </div>
                    {isActive && !coinGame.winner && !coinGame.isFlipping && (
                      <div className="flex gap-2">
                        <button type="button" onClick={() => handleSelectCoinSide(player, 'HEADS')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold ${choice === 'HEADS' ? 'bg-[#d4af37] text-black' : 'bg-neutral-800 text-white'}`}>Heads</button>
                        <button type="button" onClick={() => handleSelectCoinSide(player, 'TAILS')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold ${choice === 'TAILS' ? 'bg-[#d4af37] text-black' : 'bg-neutral-800 text-white'}`}>Tails</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {!coinGame.winner ? (
              <button type="button" onClick={handleFlipCoins} disabled={coinGame.isFlipping || !coinGame.contenders.every(p => coinGame.choices[p])} className="w-full max-w-md py-4 rounded-2xl bg-gradient-to-r from-[#d4af37] to-[#8c6d46] text-black font-black uppercase cursor-pointer">
                {coinGame.isFlipping ? 'Flipping...' : 'Flip Coin'}
              </button>
            ) : (
              <button type="button" onClick={handleCompleteCoinShowdown} className="w-full max-w-md py-4 rounded-2xl bg-green-700 text-white font-black uppercase cursor-pointer">Proceed to Showdown</button>
            )}
          </div>
        </div>
      )}

      {/* Top Status Bar */}
      <div className="w-full max-w-6xl mb-4 flex flex-wrap items-center justify-between gap-4 rounded-2xl px-6 py-3.5 shadow-2xl border-2 border-[#ffe8a3]/75 relative overflow-hidden z-10" style={{ background: 'conic-gradient(from 315deg at 50% 50%, #2a2008 0deg, #755b1b 35deg, #d6b456 65deg, #fffbe0 95deg, #ffe29a 115deg, #876a22 150deg, #1f1705 195deg, #6b5318 240deg, #ffe29a 285deg, #fffdf2 305deg, #997928 335deg, #2a2008 360deg)' }}>
        <div className="flex items-center gap-3 flex-wrap font-sans relative z-10">
          <span className="text-xs uppercase tracking-widest text-[#1c1405] font-black">Nobles:</span>
          {players.map((p, idx) => {
            const isCurrent = idx === currentPlayerIndex;
            const isElim = eliminatedPlayers.includes(p);
            const emblems = playerEmblems[p] || {};
            const isRoyalty = royaltyPlayer === p;
            const roleTitle = playerRoles[p] || 'KING';

            return (
              <div key={idx} className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs transition-all shadow ${isElim ? 'bg-red-950/90 text-red-300 line-through border border-red-900' : isCurrent ? 'bg-[#1c140f] text-[#ffe29a] font-black scale-105 border border-[#ffe8a3]' : 'bg-black/85 text-neutral-200 border border-[#8c6d46]'}`}>
                <span>{idx + 1}. {p} ({roleTitle})</span>
                {emblems.immunity && <span title="Immunity">🛡️</span>}
                {emblems.resurrection && <span title="Resurrection">✝️</span>}
                {isRoyalty && <span>👑</span>}
              </div>
            );
          })}
        </div>

        <div className="flex items-center gap-3 font-sans relative z-10">
          <div className="px-4 py-1.5 rounded-full bg-black/90 border border-[#ffe8a3]/70 text-xs text-[#ffe29a] font-bold">
            {royaltyPlayer ? <span>👑 {playerRoles[royaltyPlayer] || 'KING/QUEEN'}: <strong className="text-white">{royaltyPlayer}</strong></span> : <span>Phase: Symbols Active</span>}
          </div>
          {royaltyPlayer && <button type="button" onClick={openRoyalDarePicker} disabled={isOverlayBlocking} className="rounded-full border border-[#ffe8a3]/70 bg-black/90 px-4 py-1.5 text-xs font-bold text-[#ffe29a]">Pass a Dare</button>}
        </div>
      </div>

      {crownAnnouncement && (
        <div className="w-full max-w-6xl mb-4 bg-gradient-to-r from-[#3a2c20] via-[#593e25] to-[#3a2c20] border-2 border-[#d4af37] rounded-2xl px-6 py-3.5 text-center animate-pulse shadow-2xl font-sans relative z-10">
          <p className="text-xs sm:text-sm font-bold text-[#f3e5ab] uppercase">👑 {crownAnnouncement}</p>
        </div>
      )}

      {/* Main Wheel Table Container with Gold Container Background Style */}
      <div className="w-full max-w-7xl aspect-[16/9] min-h-[500px] max-h-[760px] rounded-[3.5rem] p-5 shadow-2xl relative flex items-stretch z-10" style={{ background: 'conic-gradient(from 315deg at 50% 50%, #2a2008 0deg, #755b1b 35deg, #d6b456 65deg, #fffbe0 95deg, #ffe29a 115deg, #876a22 150deg, #1f1705 195deg, #6b5318 240deg, #ffe29a 285deg, #fffdf2 305deg, #997928 335deg, #2a2008 360deg)', border: '8px solid #241b05', boxShadow: '0 30px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(255,255,255,0.2)' }}>
        <div className="w-full h-full rounded-[3rem] p-2.5 shadow-inner flex items-stretch relative overflow-hidden bg-[#464b50]">
          <div className="relative w-full h-full bg-transparent rounded-[2.6rem] flex flex-row items-center justify-between px-4 sm:px-6 py-2 border-2 border-[#241b05] z-10">

            {/* Spinner Section */}
            <div className="relative flex items-center justify-center z-10 w-[58%] h-full py-1">
              <div className="absolute top-2 left-2 z-30 px-4 py-1 rounded-full bg-black/80 border border-[#ffe29a]/70 text-[#ffe29a] text-[11px] uppercase font-bold tracking-widest shadow-xl font-sans">
                {isSpinning ? `${players[currentPlayerIndex]} spins...` : `${players[currentPlayerIndex]}'s Turn`}
              </div>

              <div className="relative h-[98%] aspect-square max-w-full flex items-center justify-center">
                <div className="absolute -top-1.5 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center pointer-events-none">
                  <svg width="42" height="54" viewBox="0 0 42 54" className="drop-shadow-2xl">
                    <path d="M 21 54 L 38 18 L 27 18 L 27 2 L 15 2 L 15 18 L 4 18 Z" fill="#4e5459" stroke="#ffe29a" strokeWidth="3.5" strokeLinejoin="round" />
                  </svg>
                </div>

                {/* Spinner Container with 3D Depth Shadows (No Outer White Circle) */}
                <div className="w-full h-full rounded-full overflow-hidden relative shadow-[0_50px_100px_rgba(0,0,0,0.95),_inset_0_10px_25px_rgba(255,255,255,0.4),_inset_0_-15px_35px_rgba(0,0,0,0.9)]">
                  <div className="w-full h-full rounded-full" style={{ transform: `rotate(${rotation}deg)`, transition: isSpinning ? 'transform 4.5s cubic-bezier(0.12, 0.82, 0.2, 1)' : 'none' }}>
                    <svg viewBox="-100 -100 200 200" className="w-full h-full">
                      <defs>
                        <pattern id="goldTexturePattern" width="100" height="100" patternUnits="userSpaceOnUse">
                          <image href="Metal_Gold_001_basecolor.jpg" width="100" height="100" preserveAspectRatio="none" />
                        </pattern>
                      </defs>

                      {/* Segments with Gold Background: Show Symbols initially, Numbers 1-8 only when Crowned */}
                      {SEGMENTS.map((seg, i) => {
                        const startDeg = i * 45;
                        const endDeg = (i + 1) * 45;
                        const startRad = ((startDeg - 90) * Math.PI) / 180;
                        const endRad = ((endDeg - 90) * Math.PI) / 180;
                        const x1 = 100 * Math.cos(startRad);
                        const y1 = 100 * Math.sin(startRad);
                        const x2 = 100 * Math.cos(endRad);
                        const y2 = 100 * Math.sin(endRad);
                        const wedgePath = `M 0 0 L ${x1} ${y1} A 100 100 0 0 1 ${x2} ${y2} Z`;
                        const centerAngle = startDeg + 22.5;

                        return (
                          <g key={`wedge-${seg.id}`}>
                            <path d={wedgePath} fill="url(#goldTexturePattern)" />
                            <path d={wedgePath} fill="black" opacity="0.18" />
                            <g transform={`rotate(${centerAngle})`}>
                              {!royaltyPlayer ? (
                                renderSegmentSymbol(seg.id)
                              ) : (
                                <g transform="translate(0, -72)">
                                  <circle cx="0" cy="0" r="14" fill="#140f0a" stroke="#ffe29a" strokeWidth="2.5" />
                                  <text y="5" fontSize="13" fontWeight="900" fontFamily="serif" textAnchor="middle" fill="#ffe29a" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.9))">{seg.id}</text>
                                </g>
                              )}
                            </g>
                          </g>
                        );
                      })}

                      {/* Segment Dividers with Black Marble & White Outlines */}
                      {SEGMENTS.map((seg, i) => {
                        const angle = i * 45;
                        return (
                          <g key={`divider-${seg.id}`} transform={`rotate(${angle})`}>
                            <line x1="0" y1="0" x2="0" y2="-100" stroke="#ffffff" strokeWidth="3.2" strokeLinecap="round" />
                            <line x1="0" y1="0" x2="0" y2="-100" stroke="#111111" strokeWidth="2.2" strokeLinecap="round" />
                          </g>
                        );
                      })}

                      {/* Gold Rim Border */}
                      <circle cx="0" cy="0" r="95" fill="none" stroke="#ffe29a" strokeWidth="8" />
                      <circle cx="0" cy="0" r="99" fill="none" stroke="#261d06" strokeWidth="2" />
                    </svg>
                  </div>

                  <button type="button" onClick={handleSpin} disabled={isSpinning || isOverlayBlocking} aria-label="Spin the wheel" className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-28 h-28 sm:w-32 sm:h-32 rounded-full z-20 flex items-center justify-center transition-transform duration-200 ${isSpinning || isOverlayBlocking ? 'cursor-not-allowed opacity-95' : 'cursor-pointer hover:scale-105 active:scale-95'}`} style={{ background: 'radial-gradient(circle at 35% 30%, #ffffff 0%, #ffe29a 30%, #8c6f22 62%, #1c1405 90%)', border: '4px solid #241b05' }}>
                    <div className="w-[84%] h-[84%] rounded-full p-1 border border-[#ffe8a3]/80 flex items-center justify-center bg-black/40">
                      <span className="text-xs font-black uppercase text-[#ffe29a] tracking-wider">SPIN</span>
                    </div>
                  </button>
                </div>
              </div>
            </div>

            {/* Rules Sidebar */}
            <div className="relative z-10 w-[38%] h-full flex flex-col justify-center gap-3.5 py-4 pl-4 pr-2 overflow-y-auto font-sans">
              {activeRules.length > 0 && activeRules.map((ruleItem, slotIdx) => (
                <div key={slotIdx} className="w-full rounded-2xl p-4 bg-black/90 flex flex-col justify-between shadow-xl border border-[#d4af37]/60">
                  <p className="text-sm sm:text-base font-bold text-[#ffe29a] whitespace-pre-wrap break-words leading-relaxed">{ruleItem.text}</p>
                  <div className="text-[11px] font-bold uppercase tracking-wider text-right mt-2 text-[#d4af37] font-serif">— {ruleItem.author} (Make a Rule)</div>
                </div>
              ))}
            </div>

          </div>
        </div>
      </div>
    </div>
  );
}
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
